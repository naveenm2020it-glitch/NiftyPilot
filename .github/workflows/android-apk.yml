name: Build DayPilot Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Restore missing Gradle wrapper launcher files
        shell: bash
        run: |
          flutter create --platforms=android --project-name wrapper_seed --org com.example /tmp/wrapper_seed
          cp /tmp/wrapper_seed/android/gradlew android/gradlew
          cp /tmp/wrapper_seed/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart source
        continue-on-error: true
        run: flutter analyze

      - name: Run Flutter tests
        continue-on-error: true
        run: flutter test

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Prepare APK
        run: cp build/app/outputs/flutter-apk/app-release.apk DayPilot-Android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DayPilot-Android-APK
          path: DayPilot-Android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk-${{ github.run_number }}
          name: DayPilot Android APK (Build ${{ github.run_number }})
          body: |
            Automated Android APK build from commit ${{ github.sha }}.
            Package: com.naveenmanickam.daypilot
          files: DayPilot-Android.apk
          draft: false
          prerelease: false
